[project]
name = "lay"
version = "0.1.0"
description = "Declarative tmux pane layouts"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "libtmux>=0.37",
]

[project.scripts]
lay = "lay.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
